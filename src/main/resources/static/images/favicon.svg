<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Dark Slate Background Container -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  
  <!-- Outer Search Ring (Shifted right to accommodate left handle) -->
  <circle cx="36" cy="28" r="14" fill="none" stroke="url(#gatewayGrad)" stroke-width="4"/>
  
  <!-- Left-Facing Handle -->
  <line x1="26" y1="38" x2="14" y2="50" stroke="url(#gatewayGrad)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Horizontal Text Lines Inside Glass -->
  <line x1="29" y1="23" x2="43" y2="23" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="28" x2="41" y2="28" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="33" x2="37" y2="33" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>
